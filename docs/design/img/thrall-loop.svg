<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="A rotting thrall rises again while a Gravecaller lives nearby, unless its corpse is burned">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8d8b98"/></marker>
  </defs>
  <rect width="880" height="270" rx="6" fill="#0d0d12"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#e6e1d3">
    <text x="20" y="30" font-size="16" font-weight="600">Why the Gravecaller dies first</text>
    <text x="20" y="50" fill="#8d8b98">A rotting thrall keeps coming back while a Gravecaller lives nearby. Fire ends it for good.</text>

    <rect x="20" y="96" width="150" height="52" rx="6" fill="#15151c" stroke="#8fd14f"/>
    <text x="34" y="118" font-weight="600">Rotting thrall</text><text x="34" y="136" fill="#8d8b98">slow, heavy swing</text>
    <line x1="170" y1="122" x2="226" y2="122" stroke="#8d8b98" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="176" y="114" fill="#8d8b98">killed</text>

    <rect x="230" y="96" width="150" height="52" rx="6" fill="#15151c" stroke="#8d8674"/>
    <text x="244" y="118" font-weight="600">Corpse</text><text x="244" y="136" fill="#8d8b98">lies for 6 seconds</text>
    <line x1="380" y1="122" x2="436" y2="122" stroke="#8d8b98" stroke-width="1.5" marker-end="url(#a)"/>

    <path d="M520,82 L600,122 L520,162 L440,122 Z" fill="#15151c" stroke="#a98be0"/>
    <text x="520" y="118" text-anchor="middle" font-weight="600">Gravecaller</text><text x="520" y="134" text-anchor="middle">alive nearby?</text>

    <line x1="600" y1="122" x2="676" y2="122" stroke="#8d8b98" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="612" y="114" fill="#8d8b98">yes</text>
    <rect x="680" y="96" width="180" height="52" rx="6" fill="#15151c" stroke="#8fd14f"/>
    <text x="694" y="118" font-weight="600">Rises again</text><text x="694" y="136" fill="#8d8b98">at half health</text>
    <path d="M770,148 V196 H95 V152" fill="none" stroke="#8d8b98" stroke-width="1.5" marker-end="url(#a)"/>

    <line x1="520" y1="162" x2="520" y2="226" stroke="#8d8b98" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="528" y="182" fill="#8d8b98">no</text>
    <rect x="440" y="230" width="160" height="30" rx="6" fill="#15151c" stroke="#2e2e3a"/>
    <text x="520" y="250" text-anchor="middle">Crumbles for good</text>

    <path d="M305,148 V245 H436" fill="none" stroke="#f08a3c" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="314" y="238" fill="#f08a3c">hit by fire</text>
  </g>
</svg>
