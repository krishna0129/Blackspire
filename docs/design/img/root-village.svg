<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-label="Plan of the root village. The Teleport Gate stands glowing in the middle of the square, below the tower's trunk. Winding paths lined with trees, shrubs and flowers lead to the inn and well in the north-west, the market of six stalls in the east (weapons, armour and gear, potions, food and drink, the forge, and the witchcraft room), the kingdom camps in the west, the fields of plots for sale in the south-west, and the training yard with scarecrow dummies in the south-east.">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#6fd6e6" stop-opacity=".55"/><stop offset="1" stop-color="#6fd6e6" stop-opacity="0"/></radialGradient>
    <radialGradient id="fire"><stop offset="0" stop-color="#f08a3c" stop-opacity=".6"/><stop offset="1" stop-color="#f08a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="brew"><stop offset="0" stop-color="#9be08a" stop-opacity=".55"/><stop offset="1" stop-color="#9be08a" stop-opacity="0"/></radialGradient>
    <g id="tree"><circle r="17" fill="#1f3a1c"/><circle cx="-8" cy="-6" r="11" fill="#2c4f25"/><circle cx="7" cy="-9" r="9" fill="#38612c"/><circle cx="2" cy="4" r="7" fill="#2c4f25"/></g>
    <g id="shrub"><circle r="7" fill="#2a4a22"/><circle cx="-3" cy="-2" r="4" fill="#3d6630"/></g>
    <g id="flowers"><circle r="1.8" fill="#e9838b"/><circle cx="5" cy="2" r="1.8" fill="#e2b93b"/><circle cx="-4" cy="3" r="1.8" fill="#cfc8ff"/><circle cx="2" cy="-4" r="1.8" fill="#e6e1d3"/></g>
    <g id="lamp"><rect x="-1" y="-12" width="2" height="12" fill="#55556a"/><circle cy="-13" r="3" fill="#f5c86a"/><circle cy="-13" r="9" fill="#f5c86a" opacity=".12"/></g>
    <g id="scarecrow"><rect x="-1" y="-4" width="2" height="22" fill="#6b4a2c"/><rect x="-10" y="2" width="20" height="2" fill="#6b4a2c"/><path d="M-7,2 h14 l-2,12 h-10 z" fill="#8a6a3a"/><circle cy="-7" r="5" fill="#d9c08a"/><path d="M-8,-9 h16 l-8,-7 z" fill="#4a3324"/><rect x="-11" y="2" width="3" height="5" fill="#d9a441"/><rect x="8" y="2" width="3" height="5" fill="#d9a441"/></g>
    <g id="plot"><rect width="34" height="24" rx="2" fill="#3a2a1a" stroke="#5e4620"/><path d="M4,6 h26 M4,12 h26 M4,18 h26" stroke="#2a1d12" stroke-width="2"/></g>
  </defs>

  <rect width="960" height="680" rx="6" fill="#0d0d12"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#e6e1d3">
    <text x="20" y="30" font-size="16" font-weight="600">The root village: plan</text>
    <text x="20" y="50" fill="#8d8b98">About 56 × 38 tiles. Walled in by the tower's roots; winding paths lead out from the square and its Teleport Gate.</text>

    <!-- ground, walled by roots -->
    <path d="M50,110 C150,82 250,108 340,92 C430,78 530,78 620,92 C710,106 810,80 912,104 L922,628 C820,646 720,620 610,636 C500,652 400,624 300,640 C200,654 120,630 42,636 Z" fill="#15211a" stroke="#3b4a2a" stroke-width="12"/>
    <g stroke="#3b4a2a" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M60,160 C90,180 80,210 110,230"/><path d="M904,180 C870,200 885,240 850,260"/><path d="M300,96 C310,125 290,140 300,160"/><path d="M680,98 C670,120 690,140 676,160"/><path d="M910,520 C880,540 890,575 860,590"/>
    </g>

    <!-- the trunk -->
    <path d="M360,98 C380,70 400,58 480,56 C560,58 580,70 600,98 L600,140 C560,150 400,150 360,140 Z" fill="#141019" stroke="#2c2836" stroke-width="3"/>
    <path d="M400,70 V140 M440,60 V146 M520,60 V146 M560,70 V140" stroke="#221d2a" stroke-width="3"/>
    <text x="480" y="112" text-anchor="middle" fill="#8d8b98" font-size="11">the Blackspire's trunk</text>

    <!-- paths: worn dirt, winding -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#3a3326" stroke-width="22">
        <path d="M410,305 C380,270 330,280 300,245 C285,228 262,226 250,224"/>
        <path d="M552,330 C590,300 600,350 640,322 C660,308 672,312 690,312"/>
        <path d="M398,350 C360,372 330,338 290,360 C270,371 250,368 236,372"/>
        <path d="M438,410 C430,450 380,452 360,478 C346,496 320,500 300,512"/>
        <path d="M520,402 C540,440 590,430 610,470 C620,490 640,500 660,512"/>
        <path d="M478,252 C460,220 500,196 484,150"/>
      </g>
      <g stroke="#4a4232" stroke-width="2" stroke-dasharray="3 9">
        <path d="M410,305 C380,270 330,280 300,245 C285,228 262,226 250,224"/>
        <path d="M552,330 C590,300 600,350 640,322 C660,308 672,312 690,312"/>
        <path d="M398,350 C360,372 330,338 290,360 C270,371 250,368 236,372"/>
        <path d="M438,410 C430,450 380,452 360,478 C346,496 320,500 300,512"/>
        <path d="M520,402 C540,440 590,430 610,470 C620,490 640,500 660,512"/>
      </g>
    </g>

    <!-- greenery -->
    <g>
      <use href="#tree" x="120" y="300"/><use href="#tree" x="90" y="420"/><use href="#tree" x="330" y="180"/><use href="#tree" x="610" y="190"/>
      <use href="#tree" x="350" y="420"/><use href="#tree" x="590" y="420"/><use href="#tree" x="800" y="560"/><use href="#tree" x="120" y="580"/>
      <use href="#tree" x="700" y="140"/><use href="#tree" x="250" y="140"/><use href="#tree" x="880" y="596"/><use href="#tree" x="470" y="600"/>
      <use href="#shrub" x="360" y="280"/><use href="#shrub" x="330" y="320"/><use href="#shrub" x="600" y="290"/><use href="#shrub" x="620" y="360"/>
      <use href="#shrub" x="400" y="455"/><use href="#shrub" x="565" y="460"/><use href="#shrub" x="300" y="395"/><use href="#shrub" x="455" y="190"/>
      <use href="#shrub" x="520" y="200"/><use href="#shrub" x="210" y="450"/><use href="#shrub" x="760" y="470"/><use href="#shrub" x="400" y="560"/>
      <use href="#flowers" x="345" y="300"/><use href="#flowers" x="615" y="330"/><use href="#flowers" x="390" y="440"/><use href="#flowers" x="575" y="440"/>
      <use href="#flowers" x="300" y="270"/><use href="#flowers" x="500" y="215"/><use href="#flowers" x="270" y="395"/><use href="#flowers" x="700" y="480"/>
      <use href="#flowers" x="430" y="470"/><use href="#flowers" x="640" y="270"/>
      <use href="#lamp" x="320" y="260"/><use href="#lamp" x="625" y="318"/><use href="#lamp" x="340" y="365"/><use href="#lamp" x="410" y="470"/><use href="#lamp" x="575" y="470"/>
    </g>

    <!-- the square and the Teleport Gate -->
    <circle cx="476" cy="330" r="86" fill="#26231d" stroke="#4a4232" stroke-width="2"/>
    <circle cx="476" cy="330" r="72" fill="none" stroke="#2f2b23" stroke-width="10" stroke-dasharray="14 4"/>
    <circle cx="476" cy="330" r="70" fill="url(#glow)"/>
    <circle cx="476" cy="330" r="34" fill="#16252b" stroke="#6fd6e6" stroke-width="3"/>
    <circle cx="476" cy="330" r="24" fill="none" stroke="#c8f3fa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g fill="#2c3a44" stroke="#6fd6e6" stroke-width="1.5">
      <rect x="436" y="286" width="8" height="20"/><rect x="508" y="286" width="8" height="20"/><rect x="436" y="354" width="8" height="20"/><rect x="508" y="354" width="8" height="20"/>
    </g>
    <path d="M476,312 l6,18 l-6,18 l-6,-18 z" fill="#c8f3fa"/>
    <text x="476" y="268" text-anchor="middle" font-weight="700" font-size="14" fill="#6fd6e6">Teleport Gate</text>
    <text x="476" y="438" text-anchor="middle" fill="#8d8b98" font-size="11">any floor, any safe point you've reached</text>
    <!-- notice board -->
    <rect x="386" y="318" width="22" height="16" fill="#3e2c1e" stroke="#d9a441"/><rect x="390" y="321" width="6" height="5" fill="#e6e1d3"/><rect x="398" y="323" width="6" height="7" fill="#e6e1d3"/>
    <text x="397" y="347" text-anchor="middle" font-size="10" fill="#d9a441">quests</text>
    <circle cx="452" cy="396" r="5" fill="#e6e1d3"/><text x="478" y="400" font-size="10" fill="#8d8b98">you arrive</text>

    <!-- inn, stash and the well -->
    <rect x="130" y="180" width="130" height="78" rx="4" fill="#2a2018" stroke="#a07844"/>
    <path d="M124,184 L195,150 L266,184 Z" fill="#4a3324" stroke="#a07844"/>
    <text x="195" y="212" text-anchor="middle" font-weight="600">Inn</text>
    <text x="195" y="230" text-anchor="middle" font-size="11" fill="#8d8b98">meals and the stash</text>
    <circle cx="282" cy="270" r="11" fill="#24505a" stroke="#5aa7e6" stroke-width="2"/><text x="282" y="296" text-anchor="middle" font-size="10" fill="#5aa7e6">well</text>

    <!-- the market: six stalls -->
    <path d="M690,170 C760,160 860,168 900,180 L906,470 C840,480 760,470 690,474 Z" fill="#1f1c16" stroke="#3a3326"/>
    <text x="798" y="160" text-anchor="middle" font-weight="700" font-size="14" fill="#d9a441">Market</text>
    <g font-size="11">
      <!-- awnings: striped -->
      <g><rect x="704" y="186" width="88" height="74" rx="3" fill="#241f19" stroke="#8d8b98"/><path d="M700,186 h96 l-6,14 h-84 z" fill="#8e2a38"/><path d="M716,186 l-4,14 M736,186 l-2,14 M756,186 v14 M776,186 l2,14" stroke="#e6e1d3" stroke-width="5" opacity=".5"/>
        <path d="M730,222 l22,-12 l3,3 l-22,12 z" fill="#c3cad6"/><text x="748" y="252" text-anchor="middle">Weapons</text></g>
      <g><rect x="804" y="186" width="88" height="74" rx="3" fill="#241f19" stroke="#8d8b98"/><path d="M800,186 h96 l-6,14 h-84 z" fill="#2b3350"/><path d="M816,186 l-4,14 M836,186 l-2,14 M856,186 v14 M876,186 l2,14" stroke="#e6e1d3" stroke-width="5" opacity=".5"/>
        <path d="M838,210 h20 v10 c0,8 -10,12 -10,12 c0,0 -10,-4 -10,-12 z" fill="#8d93a0"/><text x="848" y="252" text-anchor="middle">Armour &amp; gear</text></g>
      <g><rect x="704" y="282" width="88" height="74" rx="3" fill="#241f19" stroke="#8d8b98"/><path d="M700,282 h96 l-6,14 h-84 z" fill="#4e1520"/><path d="M716,282 l-4,14 M736,282 l-2,14 M756,282 v14 M776,282 l2,14" stroke="#e6e1d3" stroke-width="5" opacity=".5"/>
        <rect x="730" y="306" width="8" height="12" rx="2" fill="#d9534f"/><rect x="742" y="304" width="8" height="14" rx="2" fill="#5aa7e6"/><rect x="754" y="306" width="8" height="12" rx="2" fill="#9be08a"/><text x="748" y="348" text-anchor="middle">Potions</text></g>
      <g><rect x="804" y="282" width="88" height="74" rx="3" fill="#241f19" stroke="#8d8b98"/><path d="M800,282 h96 l-6,14 h-84 z" fill="#5e4620"/><path d="M816,282 l-4,14 M836,282 l-2,14 M856,282 v14 M876,282 l2,14" stroke="#e6e1d3" stroke-width="5" opacity=".5"/>
        <ellipse cx="840" cy="314" rx="11" ry="6" fill="#b07a3a"/><rect x="853" y="306" width="7" height="12" rx="2" fill="#7a5a3a"/><text x="848" y="348" text-anchor="middle">Food &amp; drink</text></g>
      <g><circle cx="748" cy="414" r="40" fill="url(#fire)"/><rect x="704" y="378" width="88" height="74" rx="3" fill="#2a1d18" stroke="#f08a3c"/>
        <path d="M728,410 h28 v5 h-8 v6 h6 v4 h-24 v-4 h6 v-6 h-8 z" fill="#5a5e6b"/><rect x="762" y="402" width="10" height="8" fill="#f08a3c"/><text x="748" y="444" text-anchor="middle" font-weight="600" fill="#f08a3c">The forge</text></g>
      <g><circle cx="848" cy="414" r="40" fill="url(#brew)"/><rect x="804" y="378" width="88" height="74" rx="3" fill="#1d1a2a" stroke="#b07be8"/>
        <path d="M832,404 h32 c0,14 -6,20 -16,20 c-10,0 -16,-6 -16,-20 z" fill="#2b2b33"/><ellipse cx="848" cy="404" rx="16" ry="4" fill="#9be08a"/><circle cx="843" cy="396" r="2" fill="#9be08a"/><circle cx="852" cy="391" r="1.5" fill="#9be08a"/>
        <text x="848" y="444" text-anchor="middle" font-weight="600" fill="#b07be8">Witchcraft room</text></g>
    </g>
    <text x="798" y="490" text-anchor="middle" font-size="11" fill="#8d8b98">the blacksmith forges; the arcanist brews and enchants</text>

    <!-- kingdom camps -->
    <g><path d="M120,382 l22,-32 l22,32 z" fill="#2a2018" stroke="#8e97b5"/><path d="M172,396 l22,-32 l22,32 z" fill="#2a2018" stroke="#e2b93b"/><path d="M120,436 l22,-32 l22,32 z" fill="#2a2018" stroke="#d9a441"/>
      <rect x="141" y="338" width="2" height="14" fill="#8e97b5"/><rect x="143" y="338" width="9" height="6" fill="#8e97b5"/>
      <rect x="193" y="352" width="2" height="14" fill="#e2b93b"/><rect x="195" y="352" width="9" height="6" fill="#e2b93b"/></g>
    <text x="168" y="460" text-anchor="middle" font-weight="600">Kingdom camps</text>

    <!-- fields: plots for sale -->
    <g><use href="#plot" x="110" y="500"/><use href="#plot" x="150" y="500"/><use href="#plot" x="190" y="500"/><use href="#plot" x="230" y="500"/>
      <use href="#plot" x="110" y="530"/><use href="#plot" x="150" y="530"/><use href="#plot" x="190" y="530"/><use href="#plot" x="230" y="530"/>
      <g fill="#c9a46a"><circle cx="118" cy="512" r="2"/><circle cx="128" cy="512" r="2"/><circle cx="138" cy="512" r="2"/><circle cx="118" cy="518" r="2"/><circle cx="128" cy="518" r="2"/><circle cx="138" cy="518" r="2"/></g>
      <g fill="#9be08a"><circle cx="158" cy="512" r="2"/><circle cx="168" cy="512" r="2"/><circle cx="178" cy="512" r="2"/></g>
      <g fill="#d9a441"><rect x="204" y="536" width="8" height="6"/><rect x="244" y="536" width="8" height="6"/><rect x="244" y="506" width="8" height="6"/><rect x="164" y="536" width="8" height="6"/></g>
      <path d="M100,494 h180 v74 h-180 z" fill="none" stroke="#6b4a2c" stroke-dasharray="2 4"/></g>
    <text x="190" y="588" text-anchor="middle" font-weight="600" fill="#8fd14f">Fields</text>
    <text x="190" y="604" text-anchor="middle" font-size="11" fill="#8d8b98">buy a plot (gold signs); potatoes and glowcaps grow here</text>

    <!-- training yard -->
    <rect x="640" y="510" width="200" height="86" rx="4" fill="#1e1c16" stroke="#8d8b98"/>
    <use href="#scarecrow" x="680" y="548"/><use href="#scarecrow" x="740" y="548"/><use href="#scarecrow" x="800" y="548"/>
    <text x="690" y="526" font-size="11" font-weight="700" fill="#ffd86a">31</text><text x="748" y="530" font-size="11" font-weight="700" fill="#e6e1d3">12</text><text x="806" y="524" font-size="11" font-weight="700" fill="#e6e1d3">14</text>
    <text x="740" y="616" text-anchor="middle" font-weight="600">Training yard</text>
  </g>
</svg>
