<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Enhancement success chance per attempt">
<rect width="720" height="310" rx="6" fill="#0d0d12"/>
<g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><text x="20" y="30" fill="#e6e1d3" font-size="16" font-weight="600">Enhancement success chance per attempt</text><text x="20" y="50" fill="#8d8b98" font-size="12">Before the +10% each failure adds to that item’s next try. From +6 an attempt can fail.</text><line x1="60" x2="680" y1="262" y2="262" stroke="#2e2e3a" stroke-width="1"/><text x="52" y="266" fill="#8d8b98" font-size="11" text-anchor="end">0%</text><line x1="60" x2="680" y1="219" y2="219" stroke="#2e2e3a" stroke-width="1"/><text x="52" y="223" fill="#8d8b98" font-size="11" text-anchor="end">25%</text><line x1="60" x2="680" y1="176" y2="176" stroke="#2e2e3a" stroke-width="1"/><text x="52" y="180" fill="#8d8b98" font-size="11" text-anchor="end">50%</text><line x1="60" x2="680" y1="133" y2="133" stroke="#2e2e3a" stroke-width="1"/><text x="52" y="137" fill="#8d8b98" font-size="11" text-anchor="end">75%</text><line x1="60" x2="680" y1="90" y2="90" stroke="#2e2e3a" stroke-width="1"/><text x="52" y="94" fill="#8d8b98" font-size="11" text-anchor="end">100%</text><path d="M79,262v-168a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v168z" fill="#6fd6e6"/><text x="91" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+1</text><path d="M141,262v-168a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v168z" fill="#6fd6e6"/><text x="153" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+2</text><path d="M203,262v-168a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v168z" fill="#6fd6e6"/><text x="215" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+3</text><path d="M265,262v-168a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v168z" fill="#6fd6e6"/><text x="277" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+4</text><path d="M327,262v-168a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v168z" fill="#6fd6e6"/><text x="339" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+5</text><path d="M389,262v-133.6a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v133.6z" fill="#6fd6e6"/><text x="401" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+6</text><text x="401" y="118.4" fill="#e6e1d3" font-size="11" text-anchor="middle" font-weight="600">80%</text><path d="M451,262v-107.8a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v107.8z" fill="#6fd6e6"/><text x="463" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+7</text><text x="463" y="144.2" fill="#e6e1d3" font-size="11" text-anchor="middle" font-weight="600">65%</text><path d="M513,262v-82a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v82z" fill="#6fd6e6"/><text x="525" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+8</text><text x="525" y="170" fill="#e6e1d3" font-size="11" text-anchor="middle" font-weight="600">50%</text><path d="M575,262v-61.36a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v61.36z" fill="#6fd6e6"/><text x="587" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+9</text><text x="587" y="190.64" fill="#e6e1d3" font-size="11" text-anchor="middle" font-weight="600">38%</text><path d="M637,262v-44.160000000000004a4,4 0 0 1 4,-4h16a4,4 0 0 1 4,4v44.160000000000004z" fill="#6fd6e6"/><text x="649" y="278" fill="#8d8b98" font-size="11" text-anchor="middle">+10</text><text x="649" y="207.84" fill="#e6e1d3" font-size="11" text-anchor="middle" font-weight="600">28%</text><line x1="79" x2="351" y1="78" y2="78" stroke="#8d8b98" stroke-width="1"/><text x="215" y="72" fill="#8d8b98" font-size="11" text-anchor="middle">+1 to +5 always work</text></g>
</svg>
